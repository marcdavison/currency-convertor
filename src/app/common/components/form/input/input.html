<div>
    <label>{{ label }}</label>
    <input 
        type="text"
        [value]="value"
        (input)="valueChange.emit($event.target.value)"
        (keydown)="keyDown.emit($event)"
        (blur)="blur.emit()"
    />
</div>
<div class="errorContainer">
    @if (errors?.length && touched) {
        <ul>
        @for (err of errors; track $index) {
            <li>{{ err.message }}</li>
        }
        </ul>
    }
</div>
